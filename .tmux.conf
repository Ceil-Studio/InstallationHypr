# Support de la souris (sélection, redimensionnement de panneaux)
set -g mouse on

# Support des couleurs 24-bit (True Color)
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:TC"

# Keybindings Vi en mode copie
set-window-option -g mode-keys vi

# Raccourci pour recharger la config avec Prefix + r
bind r source-file ~/.tmux.conf \; display "Configuration rechargée !"
